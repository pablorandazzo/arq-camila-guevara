backend:
  name: github
  repo: pablorandazzo/arq-camila-guevara
  branch: main
  auth_methods: [token]
media_folder: assets/images
public_folder: /assets/images
output:
  omit_empty_optional_fields: true
media_libraries:
  default:
    config:
      max_file_size: 3145728
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1800
          height: 1800
editor:
  preview: false
collections:
  - name: projects
    label: Proyectos
    label_singular: Proyecto
    folder: src/content/projects
    format: json
    create: true
    slug: '{{slug}}'
    identifier_field: title
    fields:
      - { name: title, label: Nombre del proyecto, widget: string }
      - { name: image, label: Imagen de portada, widget: image }
      - { name: alt, label: Descripción de la portada, widget: string }
      - name: category
        label: Categoría
        widget: select
        options:
          - { label: Turísticos, value: resorts }
          - { label: Comerciales, value: commercial }
      - { name: location, label: Ubicación, widget: string, required: false }
      - { name: description, label: Descripción, widget: text, required: false }
      - name: language
        label: Idioma del contenido
        widget: select
        default: es
        options:
          - { label: Español, value: es }
          - { label: Inglés, value: en }
      - { name: order, label: Orden en el listado, widget: number, value_type: int, min: 1, hint: 'Usa un número distinto para cada proyecto.' }
      - name: sections
        label: Secciones de la página
        widget: list
        required: false
        thumbnail: image
        types:
          - name: image
            label: Imagen
            fields:
              - { name: image, label: Imagen, widget: image }
              - { name: alt, label: Descripción de la imagen, widget: string }
          - name: text
            label: Texto
            fields:
              - { name: heading, label: Título, widget: string }
              - { name: body, label: Contenido, widget: text }
          - name: quote
            label: Cita
            fields:
              - { name: quote, label: Cita, widget: text }
              - { name: attribution, label: Autor, widget: string, required: false }
  - name: pages
    label: Páginas del sitio
    files:
      - name: site
        label: Inicio, contacto y privacidad
        file: src/content/site.json
        fields:
          - { name: brand, label: Nombre del sitio, widget: string, hint: 'Se usa en la cabecera y en los títulos del navegador. El título de portada se edita por separado.' }
          - { name: menu, label: Menú (proyectos y contacto), widget: list, min: 2, max: 2, allow_add: false, allow_remove: false, allow_reorder: false }
          - { name: privacyLabel, label: Etiqueta de privacidad, widget: string }
          - { name: creditLabel, label: Texto del crédito, widget: string }
          - { name: creditUrl, label: Enlace del crédito, widget: string }
          - name: home
            label: Inicio
            widget: object
            fields:
              - { name: meta, label: Descripción para buscadores, widget: text }
              - name: sections
                label: Secciones de inicio (en orden)
                widget: list
                min: 1
                allow_duplicate: false
                thumbnail: image
                types:
                  - name: home_hero
                    label: Portada
                    fields:
                      - { name: image, label: Imagen, widget: image }
                      - { name: alt, label: Descripción de la imagen, widget: string }
                      - { name: title, label: Título, widget: string, hint: 'La primera palabra se muestra más pequeña; el resto aparece destacado.' }

                  - name: home_about
                    label: Sobre Camila
                    fields:
                      - { name: label, label: Etiqueta de la sección, widget: string }
                      - { name: image, label: Imagen, widget: image }
                      - { name: alt, label: Descripción de la imagen, widget: string }
                      - { name: title, label: Título, widget: string }
                      - { name: text, label: Texto, widget: text }

                  - name: home_projects
                    label: Proyectos destacados
                    fields:
                      - name: featuredProjects
                        label: Proyectos destacados
                        widget: relation
                        collection: projects
                        multiple: true
                        min: 1
                        value_field: '{{slug}}'
                        search_fields: [title]
                        display_fields: [title]
                      - { name: projectLinkLabel, label: Texto del enlace al proyecto, widget: string }

                  - name: home_approach
                    label: Mi enfoque
                    fields:
                      - { name: label, label: Etiqueta de la sección, widget: string }
                      - { name: title, label: Título, widget: string }
                      - name: principles
                        label: Principios de diseño
                        widget: list
                        min: 3
                        max: 3
                        summary: '{{heading}}'
                        fields:
                          - { name: heading, label: Principio, widget: string }
                          - { name: text, label: Descripción, widget: text }
                      - { name: image, label: Imagen, widget: image }
                      - { name: alt, label: Descripción de la imagen, widget: string }

                  - name: image
                    label: Imagen
                    fields:
                      - { name: image, label: Imagen, widget: image }
                      - { name: alt, label: Descripción de la imagen, widget: string }
                  - name: text
                    label: Texto
                    fields:
                      - { name: heading, label: Título, widget: string }
                      - { name: body, label: Contenido, widget: text }
                  - name: quote
                    label: Cita
                    fields:
                      - { name: quote, label: Cita, widget: text }
                      - { name: attribution, label: Autor, widget: string, required: false }

          - name: contact
            label: Contacto
            widget: object
            fields:
              - { name: meta, label: Descripción para buscadores, widget: text }
              - name: sections
                label: Secciones de contacto (en orden)
                widget: list
                min: 1
                allow_duplicate: false
                types:
                  - name: contact_details
                    label: Datos de contacto y formulario
                    fields:
                      - { name: heading, label: Título, widget: string }
                      - { name: statement, label: Frase principal, widget: string }
                      - { name: cta, label: Botón de contacto, widget: string }
                      - { name: detailsLabel, label: Título de datos de contacto, widget: string }
                      - { name: address, label: Dirección, widget: text }
                      - { name: mapUrl, label: Enlace del mapa, widget: string }
                      - { name: email, label: Correo destinatario, widget: string, hint: 'También se muestra como enlace y recibe las consultas del formulario.' }
                      - { name: phoneDisplay, label: Teléfono visible, widget: string }
                      - { name: phoneHref, label: Teléfono para llamar, widget: string }
                      - { name: instagram, label: Enlace de Instagram, widget: string }
                      - { name: twitter, label: Enlace de Twitter, widget: string }
                      - { name: linkedin, label: Enlace de LinkedIn, widget: string }
                      - { name: image, label: Imagen de contacto, widget: image }
                      - { name: imageAlt, label: Descripción de la imagen, widget: string }
                  - name: image
                    label: Imagen
                    fields:
                      - { name: image, label: Imagen, widget: image }
                      - { name: alt, label: Descripción de la imagen, widget: string }
                  - name: text
                    label: Texto
                    fields:
                      - { name: heading, label: Título, widget: string }
                      - { name: body, label: Contenido, widget: text }
                  - name: quote
                    label: Cita
                    fields:
                      - { name: quote, label: Cita, widget: text }
                      - { name: attribution, label: Autor, widget: string, required: false }
          - name: privacy
            label: Privacidad
            widget: object
            fields:
              - name: sections
                label: Secciones de privacidad (en orden)
                widget: list
                min: 1
                allow_duplicate: false
                types:
                  - name: privacy_statement
                    label: Declaración de privacidad
                    fields:
                      - { name: heading, label: Título, widget: string }
                      - { name: backLabel, label: Texto del enlace de regreso, widget: string }
                      - { name: text, label: Declaración, widget: text }
                      - { name: linkText, label: Texto del enlace de referencia, widget: string }
                      - { name: linkUrl, label: Enlace de referencia, widget: string }
                  - name: image
                    label: Imagen
                    fields:
                      - { name: image, label: Imagen, widget: image }
                      - { name: alt, label: Descripción de la imagen, widget: string }
                  - name: text
                    label: Texto
                    fields:
                      - { name: heading, label: Título, widget: string }
                      - { name: body, label: Contenido, widget: text }
                  - name: quote
                    label: Cita
                    fields:
                      - { name: quote, label: Cita, widget: text }
                      - { name: attribution, label: Autor, widget: string, required: false }
