backend:
  name: github
  repo: pablorandazzo/arq-camila-guevara
  branch: main
  auth_methods: [token]
media_folder: assets/images
public_folder: /assets/images
output:
  omit_empty_optional_fields: true
media_libraries:
  default:
    config:
      max_file_size: 3145728
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1800
          height: 1800
editor:
  preview: false
collections:
  - name: projects
    label: Projects
    folder: src/content/projects
    format: json
    create: true
    slug: '{{slug}}'
    identifier_field: title
    fields:
      - { name: title, label: Title, widget: string }
      - { name: image, label: Cover image, widget: image }
      - { name: alt, label: Cover image description, widget: string }
      - name: category
        label: Category
        widget: select
        options:
          - { label: Tourism, value: resorts }
          - { label: Commercial, value: commercial }
      - { name: location, label: Location, widget: string, required: false }
      - { name: type, label: Project type, widget: string }
      - { name: description, label: Description, widget: text, required: false }
      - name: language
        label: Content language
        widget: select
        default: es
        options:
          - { label: Spanish, value: es }
          - { label: English, value: en }
      - { name: order, label: Sort order, widget: number, value_type: int, min: 1 }
      - name: sections
        label: Page sections
        widget: list
        required: false
        types:
          - name: image
            label: Image
            fields:
              - { name: image, label: Image, widget: image }
              - { name: alt, label: Image description, widget: string }
          - name: text
            label: Text
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }
          - name: quote
            label: Quote
            fields:
              - { name: quote, label: Quote, widget: text }
              - { name: attribution, label: Attribution, widget: string, required: false }
  - name: articles
    label: Articles
    folder: src/content/articles
    format: json
    create: true
    slug: '{{slug}}'
    identifier_field: title
    fields:
      - { name: title, label: Title, widget: string }
      - { name: image, label: Cover image, widget: image }
      - { name: alt, label: Cover image description, widget: string }
      - name: categories
        label: Categories
        widget: select
        multiple: true
        required: false
        options:
          - { label: Updates, value: updates }
          - { label: Commercial, value: commercial }
          - { label: Tourism, value: resorts }
          - { label: Newsletters, value: newsletters }
      - { name: summary, label: Summary, widget: text, required: false }
      - { name: originalSlug, label: Original article slug, widget: string, required: false }
      - { name: order, label: Sort order, widget: number, value_type: int, min: 1 }
      - name: sections
        label: Article sections
        widget: list
        required: false
        types:
          - name: image
            label: Image
            fields:
              - { name: image, label: Image, widget: image }
              - { name: alt, label: Image description, widget: string }
          - name: text
            label: Text
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }
          - name: quote
            label: Quote
            fields:
              - { name: quote, label: Quote, widget: text }
              - { name: attribution, label: Attribution, widget: string, required: false }
  - name: pages
    label: Site pages
    files:
      - name: site
        label: Site-wide copy and pages
        file: src/content/site.json
        fields:
          - { name: brand, label: Brand name, widget: string }
          - { name: established, label: Established label, widget: string }
          - { name: menu, label: Navigation labels (studio, projects, journal, contact), widget: list, min: 4, max: 4 }
          - { name: privacyLabel, label: Privacy label, widget: string }
          - { name: creditLabel, label: Credit label, widget: string }
          - { name: creditUrl, label: Credit URL, widget: string }
          - name: home
            label: Home
            widget: object
            fields:
              - { name: meta, label: Search description, widget: text }
              - name: sections
                label: Home sections (ordered)
                widget: list
                min: 1
                types:
                  - name: home_hero
                    label: Home hero
                    fields:
                      - { name: image, label: Image, widget: image }
                      - { name: alt, label: Image description, widget: string }
                      - { name: intro, label: Introduction, widget: text }
                      - { name: title, label: Title, widget: string }
                  - name: home_intro
                    label: Studio and featured projects
                    fields:
                      - { name: label, label: Section label, widget: string }
                      - { name: image, label: Image, widget: image }
                      - { name: alt, label: Image description, widget: string }
                      - { name: title, label: Title, widget: string }
                      - { name: text, label: Text, widget: text }
                      - { name: linkLabel, label: Studio link label, widget: string }
                      - { name: linkHref, label: Studio link path, widget: string }
                      - { name: projectLinkLabel, label: Project link label, widget: string }
                      - { name: featuredProjects, label: Featured project IDs, widget: list, min: 1, max: 3, hint: 'Use exact project filenames without .json.' }
                  - name: home_services
                    label: Services and image
                    fields:
                      - { name: label, label: Section label, widget: string }
                      - { name: text, label: Text, widget: text }
                      - { name: image, label: Image, widget: image }
                      - { name: alt, label: Image description, widget: string }
                      - { name: focusPrefix, label: Focus line prefix, widget: string }
                      - { name: commercialLabel, label: Commercial link, widget: string }
                      - { name: conjunction, label: Conjunction, widget: string }
                      - { name: resortsLabel, label: Tourism link, widget: string }
                      - { name: linkLabel, label: All projects label, widget: string }
                      - { name: linkHref, label: All projects path, widget: string }
                  - name: home_journal
                    label: Journal and featured articles
                    fields:
                      - { name: title, label: Section title, widget: string }
                      - { name: text, label: Introduction, widget: text }
                      - { name: linkLabel, label: Journal link label, widget: string }
                      - { name: linkHref, label: Journal link path, widget: string }
                      - { name: articleLinkLabel, label: Article link label, widget: string }
                      - { name: featuredArticles, label: Featured article IDs, widget: list, min: 1, max: 3, hint: 'Use exact article filenames without .json.' }
                  - name: image
                    label: Image
                    fields:
                      - { name: image, label: Image, widget: image }
                      - { name: alt, label: Image description, widget: string }
                  - name: text
                    label: Text
                    fields:
                      - { name: heading, label: Heading, widget: string }
                      - { name: body, label: Body, widget: text }
                  - name: quote
                    label: Quote
                    fields:
                      - { name: quote, label: Quote, widget: text }
                      - { name: attribution, label: Attribution, widget: string, required: false }
          - name: about
            label: Studio page
            widget: object
            fields:
              - { name: meta, label: Search description, widget: text }
              - name: sections
                label: Studio sections (ordered)
                widget: list
                min: 1
                types:
                  - name: split_hero
                    label: Split hero
                    fields:
                      - { name: image, label: Image, widget: image }
                      - { name: alt, label: Image description, widget: string }
                      - { name: title, label: Title, widget: string }
                  - name: statement
                    label: Statement
                    fields:
                      - { name: label, label: Section label, widget: string }
                      - { name: text, label: Text, widget: text }
                  - name: feature
                    label: Text and image
                    fields:
                      - { name: label, label: Section label, widget: string }
                      - { name: title, label: Title, widget: string }
                      - { name: text, label: Text, widget: text }
                      - { name: image, label: Image, widget: image }
                      - { name: alt, label: Image description, widget: string }
                      - name: imageSide
                        label: Image placement
                        widget: select
                        options:
                          - { label: Left, value: left }
                          - { label: Right, value: right }
                      - { name: linkLabel, label: Link label, widget: string, required: false }
                      - { name: linkHref, label: Link path, widget: string, required: false }
                  - name: call_to_action
                    label: Closing call to action
                    fields:
                      - { name: text, label: Statement, widget: text }
                      - { name: linkLabel, label: Link label, widget: string }
                      - { name: linkHref, label: Link path, widget: string }
                  - name: image
                    label: Image
                    fields:
                      - { name: image, label: Image, widget: image }
                      - { name: alt, label: Image description, widget: string }
                  - name: text
                    label: Text
                    fields:
                      - { name: heading, label: Heading, widget: string }
                      - { name: body, label: Body, widget: text }
                  - name: quote
                    label: Quote
                    fields:
                      - { name: quote, label: Quote, widget: text }
                      - { name: attribution, label: Attribution, widget: string, required: false }
          - name: contact
            label: Contact page
            widget: object
            fields:
              - { name: meta, label: Search description, widget: text }
              - name: sections
                label: Contact sections (ordered)
                widget: list
                min: 1
                types:
                  - name: contact_details
                    label: Contact details and form
                    fields:
                      - { name: heading, label: Heading, widget: string }
                      - { name: statement, label: Statement, widget: string }
                      - { name: cta, label: Contact button, widget: string }
                      - { name: detailsLabel, label: Details label, widget: string }
                      - { name: address, label: Address, widget: text }
                      - { name: mapUrl, label: Map URL, widget: string }
                      - { name: email, label: Email recipient, widget: string }
                      - { name: phoneDisplay, label: Display phone, widget: string }
                      - { name: phoneHref, label: Dialable phone, widget: string }
                      - { name: instagram, label: Instagram URL, widget: string }
                      - { name: twitter, label: Twitter URL, widget: string }
                      - { name: linkedin, label: LinkedIn URL, widget: string }
                      - { name: image, label: Contact image, widget: image }
                      - { name: imageAlt, label: Contact image description, widget: string }
                  - name: image
                    label: Image
                    fields:
                      - { name: image, label: Image, widget: image }
                      - { name: alt, label: Image description, widget: string }
                  - name: text
                    label: Text
                    fields:
                      - { name: heading, label: Heading, widget: string }
                      - { name: body, label: Body, widget: text }
                  - name: quote
                    label: Quote
                    fields:
                      - { name: quote, label: Quote, widget: text }
                      - { name: attribution, label: Attribution, widget: string, required: false }
          - name: privacy
            label: Privacy page
            widget: object
            fields:
              - name: sections
                label: Privacy sections (ordered)
                widget: list
                min: 1
                types:
                  - name: privacy_statement
                    label: Privacy statement
                    fields:
                      - { name: heading, label: Heading, widget: string }
                      - { name: backLabel, label: Back link label, widget: string }
                      - { name: text, label: Statement, widget: text }
                      - { name: linkText, label: Source link label, widget: string }
                      - { name: linkUrl, label: Source URL, widget: string }
                  - name: image
                    label: Image
                    fields:
                      - { name: image, label: Image, widget: image }
                      - { name: alt, label: Image description, widget: string }
                  - name: text
                    label: Text
                    fields:
                      - { name: heading, label: Heading, widget: string }
                      - { name: body, label: Body, widget: text }
                  - name: quote
                    label: Quote
                    fields:
                      - { name: quote, label: Quote, widget: text }
                      - { name: attribution, label: Attribution, widget: string, required: false }
